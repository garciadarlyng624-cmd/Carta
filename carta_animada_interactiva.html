<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para ti - Carta Interactiva</title>
  <!-- Tailwind CSS para diseño y respuestas dinámicas -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts para tipografías elegantes de carta/pergamino -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* Estilos personalizados y utilidades de animación */
    body {
      background-color: #0d0907;
      color: #d1b894;
      font-family: 'Montserrat', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .font-handwriting {
      font-family: 'Great Vibes', cursive;
    }

    .font-letter-body {
      font-family: 'Dancing Script', cursive;
    }

    /* Fondo principal con viñeta y resplandor central cálido */
    .bg-vignette {
      background: radial-gradient(circle at 50% 45%, #231610 0%, #0f0a07 60%, #050302 100%);
    }

    /* Estilos del sobre e interacciones */
    .envelope-wrapper {
      perspective: 1000px;
    }

    .envelope {
      position: relative;
      width: 280px;
      height: 180px;
      background: #e6d3ba;
      border-radius: 6px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 15px rgba(120,80,40,0.15);
      cursor: pointer;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    @media (min-width: 640px) {
      .envelope {
        width: 320px;
        height: 200px;
      }
    }

    .envelope:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(212,160,89,0.2);
    }

    /* Solapa superior del sobre */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 110px solid #d9bf9c;
      transform-origin: top;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }

    @media (min-width: 640px) {
      .envelope-flap {
        border-left-width: 160px;
        border-right-width: 160px;
        border-top-width: 125px;
      }
    }

    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Bolsillo interior del sobre */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, transparent 40%, #cca276 100%);
      border-radius: 6px;
      z-index: 3;
      clip-path: polygon(0 0, 0 100%, 100% 100%, 100% 0, 50% 55%);
    }

    /* Sello de cera */
    .wax-seal {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      background: radial-gradient(circle at 35% 35%, #b92b2b 0%, #7a1515 70%, #4a0a0a 100%);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.25), inset 0 -2px 4px rgba(0,0,0,0.6);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .wax-seal::after {
      content: '♥';
      color: #3d0808;
      font-size: 22px;
      text-shadow: 0 1px 1px rgba(255,255,255,0.2);
    }

    .envelope.open .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
    }

    /* Pergamino / Carta */
    .paper-texture {
      background: #f5edd6;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8) 0%, rgba(240,225,195,0.5) 100%),
        url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.04' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 40px rgba(160, 120, 70, 0.2);
    }

    /* Animación de la Vela */
    .flame {
      width: 12px;
      height: 24px;
      background: linear-gradient(to bottom, #ffffff 0%, #ffeb3b 25%, #ff9800 60%, rgba(255, 87, 34, 0) 100%);
      border-radius: 50% 50% 20% 20%;
      filter: drop-shadow(0 0 12px #ff9800) drop-shadow(0 0 25px #ff5722);
      animation: flicker 0.1s infinite alternate;
      transform-origin: center bottom;
    }

    .candle-glow {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(255, 152, 0, 0.2) 0%, rgba(255, 152, 0, 0) 70%);
      border-radius: 50%;
      top: -50px;
      left: -54px;
      pointer-events: none;
      animation: pulseGlow 2s infinite alternate ease-in-out;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-1deg); opacity: 0.95; }
      20% { transform: scale(1.05, 0.95) rotate(1deg); opacity: 1; }
      40% { transform: scale(0.98, 1.02) rotate(-2deg); opacity: 0.9; }
    /* Pluma de escribir animada con posicionamiento preciso */
    .quill-pen {
      position: absolute;
      width: 55px;
      height: 55px;
      pointer-events: none;
      z-index: 50;
      transition: left 0.05s linear, top 0.05s linear, transform 0.1s ease;
      filter: drop-shadow(3px 5px 6px rgba(0,0,0,0.4));
      transform-origin: bottom left;
    }

    .quill-writing {
      animation: quillMotion 0.15s infinite alternate ease-in-out;
    }

    @keyframes quillMotion {
      0% { transform: rotate(0deg) scale(1); }
      100% { transform: rotate(-8deg) translateY(-2px) scale(1.02); }
    }

    /* Animación de pétalos cayendo suavemente */
    @keyframes fallingPetal {
      0% {
        transform: translateY(-10px) rotate(0deg) translateX(0);
        opacity: 0.8;
      }
      50% {
        transform: translateY(120px) rotate(180deg) translateX(15px);
        opacity: 0.9;
      }
      100% {
        transform: translateY(240px) rotate(360deg) translateX(-10px);
        opacity: 0;
      }
    }

    .animate-petal {
      animation: fallingPetal 6s infinite linear;
    }

    /* Estilos del scroll personalizables */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(139, 90, 43, 0.3);
      border-radius: 10px;
    }

    /* Animación del pulso de audio */
    @keyframes audioWave {
      0%, 100% { height: 6px; }
      50% { height: 16px; }
    }
    .bar-1 { animation: audioWave 1s infinite ease-in-out 0.1s; }
    .bar-2 { animation: audioWave 1s infinite ease-in-out 0.3s; }
    .bar-3 { animation: audioWave 1s infinite ease-in-out 0.5s; }
  </style>
</head>
<body class="h-screen w-screen bg-vignette flex flex-col items-center justify-center relative overflow-hidden">

          <!-- Flor Rosa SVG Iluminada -->

              <!-- Pétalo principal -->

  <!-- Elemento Audio Generado por Sintetizador de Audio Web (Melodía Suave de Fondo sin Dependencia Externa) -->
  <script>
    // Audio con Web Audio API para asegurar que SIEMPRE suene música suave y romántica en cualquier dispositivo
    class AmbientMusic {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.interval = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }

      playNote(freq, duration = 2.5, delay = 0) {
        if (!this.isPlaying || !this.ctx) return;
        
        setTimeout(() => {
          if (!this.isPlaying) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

            // Envolvente suave estilo piano/arpa
            gain.gain.setValueAtTime(0, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.08, this.ctx.currentTime + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start();
            osc.stop(this.ctx.currentTime + duration);
          } catch (e) {}
        }, delay * 1000);
      }

      start() {
        this.init();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        this.isPlaying = true;
        
        // Melodía romántica en la menor / do mayor
        const notes = [
          220, 261.63, 329.63, 392, 440, // A3, C4, E4, G4, A4
          349.23, 261.63, 329.63, 523.25, // F4, C4, E4, C5
          196, 246.94, 293.66, 392, 440  // G3, B3, D4, G4, A4
        ];

        let step = 0;
        const playSequence = () => {
          if (!this.isPlaying) return;
          const note = notes[step % notes.length];
          this.playNote(note, 3.0, 0);
          if (step % 2 === 0) {
            this.playNote(note * 0.5, 4.0, 0.1); // Bajo suave
          }
          step++;
        };

        playSequence();
        this.interval = setInterval(playSequence, 800);
      }

      stop() {
        this.isPlaying = false;
        if (this.interval) clearInterval(this.interval);
      }
    }

    const musicPlayer = new AmbientMusic();

    function toggleAudio() {
      const musicBtn = document.getElementById('musicBtn');
      const audioBars = document.getElementById('audioBars');
      const musicIcon = document.getElementById('musicIcon');

      if (musicPlayer.isPlaying) {
        musicPlayer.stop();
        audioBars.classList.add('hidden');
        musicIcon.classList.remove('hidden');
      } else {
        musicPlayer.start();
        audioBars.classList.remove('hidden');
        musicIcon.classList.add('hidden');
      }
    }
  </script>

  <!-- Lógica Principal de la Carta Animada -->
  <script>
    // Texto exacto recibido en la especificación
    const textToType = `Te escribo esta carta sin saber muy bien por dónde empezar, porque hay cosas que siento desde hace tanto que ya no sé cómo decirlas sin que se rompan.

Si pudiera detener el tiempo, elegiría detenerlo en los días en que tu risa llena todo, y me quedaría ahí, guardándola.

Pero como no puedo, escribo.

Escribo para que sepas que te pienso, incluso cuando parece que no. Que te extraño, incluso cuando estoy contigo.

Que te elijo, cada mañana, aunque a veces me cueste decirte cuánto.

No sé qué nos depare el mundo, pero si sé que quiero descubrirlo contigo. Y si el mundo acaba mañana, quiero que mi última tarde sea una en la que estés tú.

Gracias por existir. Gracias por quedarte. Gracias por elegirme.

Tuya, siempre.`;

    let charIndex = 0;
    let isTyping = false;

    // Inicialización al cargar la pantalla
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const header = document.getElementById('envelopeHeader');
        header.classList.remove('opacity-0', '-translate-y-4');
      }, 300);
    });

    // Actualiza la posición de la pluma para seguir al cursor de texto exacto
    function updateQuillPosition() {
      const cursor = document.getElementById('cursor');
      const paper = document.getElementById('paper');
      const quill = document.getElementById('quillContainer');

      if (!cursor || !paper || !quill) return;

      const cursorRect = cursor.getBoundingClientRect();
      const paperRect = paper.getBoundingClientRect();

      // Calcular la posición relativa dentro del pergamino
      const left = cursorRect.left - paperRect.left - 12;
      const top = cursorRect.top - paperRect.top - 45;

      quill.style.left = `${left}px`;
      quill.style.top = `${top}px`;
    }

    // Paso 1 -> Abrir Sobre e Iniciar Carta
    function openLetter() {
      const envelope = document.getElementById('envelope');
      const tapInstruction = document.getElementById('tapInstruction');
      const envelopeHeader = document.getElementById('envelopeHeader');
      const step1 = document.getElementById('step1');
      const step2 = document.getElementById('step2');

      if (!musicPlayer.isPlaying) {
        toggleAudio();
      }

      envelope.classList.add('open');
      tapInstruction.style.opacity = '0';

      setTimeout(() => {
        envelopeHeader.classList.add('opacity-0');
        step1.classList.add('opacity-0', 'scale-95');

        setTimeout(() => {
          step1.classList.add('hidden');
          step2.classList.remove('hidden');

          setTimeout(() => {
            step2.classList.remove('opacity-0');
            startTyping();
          }, 100);
        }, 800);

      }, 700);
    }

    // Paso 2 -> Efecto de Escritura Progresiva con Pluma
    function startTyping() {
      if (isTyping) return;
      isTyping = true;

      const typedTextElem = document.getElementById('typedText');
      const textContainer = document.getElementById('textContainer');
      const cursor = document.getElementById('cursor');
      const quill = document.getElementById('quillContainer');

      // Mostrar la pluma
      quill.classList.remove('opacity-0');

      function typeNextChar() {
        if (charIndex < textToType.length) {
          const char = textToType.charAt(charIndex);
          
          if (char === '\n') {
            typedTextElem.innerHTML += '<br>';
          } else {
            typedTextElem.innerHTML += char;
          }

          charIndex++;

          // Actualizar posición de la pluma
          updateQuillPosition();

          // Autoscroll suave
          textContainer.scrollTop = textContainer.scrollHeight;

          let delay = Math.floor(Math.random() * 35) + 40;
          if (char === '.' || char === ',') delay += 180;
          if (char === '\n') delay += 300;

          setTimeout(typeNextChar, delay);
        } else {
          // Ocultar pluma y cursor al finalizar
          quill.classList.add('opacity-0');
          cursor.classList.add('hidden');
          setTimeout(transitionToStep3, 2200);
        }
      }

      typeNextChar();
    }

    // Paso 3 -> Transición a la Escena Final de la Rosa
    function transitionToStep3() {
      const step2 = document.getElementById('step2');
      const step3 = document.getElementById('step3');

      step2.classList.add('opacity-0', 'translate-y-4');

      setTimeout(() => {
        step2.classList.add('hidden');
        step3.classList.remove('hidden');

        setTimeout(() => {
          step3.classList.remove('opacity-0');
        }, 100);

      }, 1000);
    }
  </script>
</body>
